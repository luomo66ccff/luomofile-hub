{% if user and user.status == 'active' %}
<div class="dock-overlay" data-dock-overlay aria-hidden="true"><div class="beam"></div><div class="dock-target"><svg aria-hidden="true"><use href="#i-anchor"/></svg><strong>松手，即可靠岸</strong><span>每次最多 20 个文件 · 图片自动进入图片库</span></div></div>
<section class="tray" data-tray aria-label="装卸队列" hidden><div class="tray-head"><strong>装卸队列</strong><span class="faint num" data-tray-summary></span><button class="btn btn-ghost btn-sm" type="button" data-tray-toggle aria-expanded="true">收起</button></div><ul class="tray-list" data-tray-list aria-live="polite"></ul><a class="btn btn-ghost" href="{{ request.url }}" data-tray-refresh hidden>刷新查看</a></section>{% endif %}
<dialog class="palette" data-palette aria-label="命令面板"><div class="palette-input"><svg aria-hidden="true"><use href="#i-search"/></svg><input type="search" aria-label="命令搜索" placeholder="搜索文件、相册，或输入命令" autocomplete="off" role="combobox" aria-controls="palette-results" aria-expanded="false"><button class="btn btn-ghost btn-sm" type="button" data-palette-close>Esc</button></div><ul id="palette-results" class="palette-list" role="listbox" aria-label="结果"></ul><div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></div>
<template data-palette-commands><a href="/" data-group="跳转" data-icon="home">{{ '我的码头' if user else '文件星港' }}</a>{% for href, icon, label in navigation %}<a href="{{ href }}" data-group="跳转" data-icon="{{ icon }}">{{ label }}</a>{% endfor %}{% if user and user.status == 'active' %}<a href="/developer" data-group="跳转" data-icon="code">开发者</a>{% if user.role == 'admin' %}<a href="/admin" data-group="跳转" data-icon="shield">站点管理</a>{% endif %}<a href="/upload" data-group="动作" data-icon="upload">上传文件</a><a href="/albums/new" data-group="动作" data-icon="album">新建相册</a><a href="/temp" data-group="动作" data-icon="ferry">发一班临时渡轮</a>{% else %}<a href="/login" data-group="动作" data-icon="key">登录</a><a href="/register" data-group="动作" data-icon="key">注册</a>{% endif %}</template></dialog>
<dialog class="sheet" data-confirm-dialog aria-labelledby="confirm-title"><div class="sheet-head"><h2 id="confirm-title">确认操作</h2></div><div class="sheet-body"><p data-confirm-message></p></div><div class="sheet-foot"><button class="btn" type="button" data-confirm-cancel>取消</button><button class="btn btn-danger" type="button" data-confirm-accept>确认继续</button></div></dialog><div class="toasts" data-toasts aria-live="polite"></div>
